<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACDBio · Rede bibliográfica</title>
<link rel="stylesheet" href="./base.css?v=2">
<link rel="stylesheet" href="./responsive.css?v=2">
</head>
<body>
<header class="top">
  <div class="brand"><strong>Rede bibliográfica</strong><small id="status">Carregando…</small></div>
  <div class="toolbar">
    <button id="libraryBtn" class="btn text mobile-library">Bibliografia</button>
    <input id="q" class="search" placeholder="Buscar autor, artigo, DOI, keyword…">
    <div class="chips">
      <button class="chip" data-type="Author"><span class="dot a"></span>Autores</button>
      <button class="chip" data-type="Article"><span class="dot p"></span>Artigos</button>
      <button class="chip" data-type="Institution"><span class="dot i"></span>Instituições</button>
      <button class="chip" data-type="Venue"><span class="dot v"></span>Venues</button>
    </div>
    <button id="filters" class="btn text">Filtros</button>
    <button id="info" class="btn text">Info</button>
  </div>
</header>
<div class="app">
  <aside id="explorer" class="explorer">
    <div class="explorer-head">
      <div class="explorer-kicker">Explorar</div>
      <div class="explorer-title"><strong>Artigos por autor</strong><span id="explorerCount"></span></div>
      <input id="authorFilter" class="author-filter" placeholder="Filtrar autores…">
    </div>
    <div id="authorList" class="author-list"></div>
  </aside>
  <main class="stage">
    <div id="explorerScrim" class="explorer-scrim"></div>
    <div id="cy" class="cy"></div>
    <div id="focusBar" class="focusbar"><div class="focus-card"><button id="back" class="btn back">← Voltar</button><div class="focus-text"><small>Foco no artigo</small><strong id="focusTitle"></strong></div></div></div>
    <div class="controls">
      <button id="minus" class="btn">−</button><button id="fit" class="btn">◎</button><button id="plus" class="btn">+</button>
      <select id="layout"><option value="cose">Orgânico</option><option value="concentric">Radial</option><option value="breadthfirst">Hierárquico</option><option value="circle">Circular</option><option value="grid">Grade</option></select>
    </div>
    <div id="filterPop" class="pop" hidden>
      <h3>Filtros</h3>
      <label>De <b id="fromLabel"></b><input id="fromYear" type="range"></label>
      <label>Até <b id="toLabel"></b><input id="toYear" type="range"></label>
      <div class="rels">
        <label><input class="rel" data-rel="AUTHORED" type="checkbox" checked> AUTHORED</label>
        <label><input class="rel" data-rel="AFFILIATED_WITH" type="checkbox" checked> AFFILIATED_WITH</label>
        <label><input class="rel" data-rel="PUBLISHED_IN" type="checkbox" checked> PUBLISHED_IN</label>
      </div>
      <button id="reset" class="btn">Limpar filtros</button>
    </div>
    <aside id="panel" class="panel">
      <div class="panel-head"><div><small>GRAPH · CONTEXTO</small><strong id="panelTitle">Visão geral</strong></div><button id="close" class="btn">×</button></div>
      <div id="panelBody" class="body"></div>
    </aside>
    <div id="loading" class="loading">Carregando rede…</div>
    <div id="error" class="error" hidden><b>Falha ao carregar a base</b><small id="errorText"></small></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<script src="./app-core.js?v=3"></script>
<script src="./app-ui.js?v=3"></script>
</body>
</html>

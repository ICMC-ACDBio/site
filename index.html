<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACDBio · Rede bibliográfica</title>
<style>
:root{--bg:#f7f8fa;--surface:#fff;--text:#1f2933;--muted:#77818b;--border:#dde3e8;--author:#3f789f;--article:#7d858d;--institution:#57826e;--venue:#786785;--edge:#b8c0c7}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:13px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
button,input,select{font:inherit;color:inherit}.top{height:62px;display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.96);position:relative;z-index:20}
.brand{min-width:175px}.brand strong{display:block;font-size:13px}.brand small{color:var(--muted);font-size:10px}
.toolbar{display:flex;align-items:center;gap:6px;flex:1;min-width:0}.search{height:38px;flex:1;max-width:420px;border:1px solid var(--border);border-radius:10px;background:#f1f3f5;padding:0 12px;outline:0}.search:focus{border-color:#9db2c2;background:#fff}
.chips{display:flex;gap:5px}.chip,.btn,select{height:36px;border:1px solid var(--border);border-radius:9px;background:#fff;padding:0 10px;cursor:pointer}.chip.off{opacity:.38}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.a{background:var(--author)}.p{background:var(--article);border-radius:2px}.i{background:var(--institution)}.v{background:var(--venue);border-radius:2px}
main{height:calc(100% - 62px);position:relative}.cy{position:absolute;inset:0;background-image:radial-gradient(#d1d7dc .7px,transparent .7px);background-size:18px 18px}
.controls{position:absolute;left:12px;bottom:12px;z-index:8;display:flex;gap:6px}.controls button{width:36px;padding:0}
.pop{position:absolute;top:10px;right:10px;width:290px;background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:12px;padding:13px;z-index:30;box-shadow:0 12px 35px #1f293318}.pop[hidden]{display:none}.pop h3{margin:0 0 12px;font-size:12px}.pop label{display:block;margin:10px 0;color:#48525c}.pop input[type=range]{width:100%}.rels{display:grid;gap:7px;margin:13px 0}
.panel{position:absolute;right:0;top:0;width:min(390px,92vw);height:100%;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-left:1px solid var(--border);transform:translateX(101%);transition:transform .2s ease;z-index:15;display:flex;flex-direction:column}.panel.open{transform:none}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:13px;border-bottom:1px solid var(--border)}.panel-head small{display:block;color:var(--muted);font:9px ui-monospace,monospace;letter-spacing:.07em}.panel-head strong{display:block;margin-top:3px;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body{overflow:auto;padding:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{border:1px solid var(--border);border-radius:9px;background:#fff;padding:9px}.stat small{color:var(--muted)}.stat b{display:block;font:600 18px ui-monospace,monospace;margin-top:3px}
.section{margin-top:16px}.section h4{font:9px ui-monospace,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}.row{width:100%;border:0;background:transparent;border-radius:7px;padding:7px 6px;display:flex;gap:8px;align-items:center;text-align:left;cursor:pointer}.row:hover{background:#f0f3f5}.row span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{padding:8px 0;border-bottom:1px solid var(--border)}.detail label{display:block;font:9px ui-monospace,monospace;color:var(--muted);text-transform:uppercase;margin-bottom:3px}.tag{display:inline-block;margin-bottom:8px;border:1px solid var(--border);border-radius:999px;padding:3px 8px;color:var(--muted);font-size:10px}.link{display:inline-block;margin-top:10px;color:#2a6285;text-decoration:none}
.loading,.error{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:0 8px 24px #1f293315}.error{max-width:420px}.error b{display:block}.error small{display:block;color:var(--muted);margin-top:5px}
@media(max-width:980px){.chips{display:none}.brand{min-width:auto}}
@media(max-width:680px){.top{height:56px;padding:7px}.brand small{display:none}.search{max-width:none}.btn.text{padding:0 8px}.panel{top:auto;bottom:0;width:100%;height:70%;border-left:0;border-top:1px solid var(--border);border-radius:16px 16px 0 0;transform:translateY(101%)}main{height:calc(100% - 56px)}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><strong>Rede bibliográfica</strong><small id="status">Carregando…</small></div>
  <div class="toolbar">
    <input id="q" class="search" placeholder="Buscar autor, artigo, DOI, keyword…">
    <div class="chips">
      <button class="chip" data-type="Author"><span class="dot a"></span>Autores</button>
      <button class="chip" data-type="Article"><span class="dot p"></span>Artigos</button>
      <button class="chip" data-type="Institution"><span class="dot i"></span>Instituições</button>
      <button class="chip" data-type="Venue"><span class="dot v"></span>Venues</button>
    </div>
    <button id="filters" class="btn text">Filtros</button>
    <button id="info" class="btn text">Info</button>
  </div>
</header>
<main>
  <div id="cy" class="cy"></div>
  <div class="controls">
    <button id="minus" class="btn">−</button><button id="fit" class="btn">◎</button><button id="plus" class="btn">+</button>
    <select id="layout"><option value="cose">Orgânico</option><option value="concentric">Radial</option><option value="breadthfirst">Hierárquico</option><option value="circle">Circular</option><option value="grid">Grade</option></select>
  </div>
  <div id="filterPop" class="pop" hidden>
    <h3>Filtros</h3>
    <label>De <b id="fromLabel"></b><input id="fromYear" type="range"></label>
    <label>Até <b id="toLabel"></b><input id="toYear" type="range"></label>
    <div class="rels">
      <label><input class="rel" data-rel="AUTHORED" type="checkbox" checked> AUTHORED</label>
      <label><input class="rel" data-rel="AFFILIATED_WITH" type="checkbox" checked> AFFILIATED_WITH</label>
      <label><input class="rel" data-rel="PUBLISHED_IN" type="checkbox" checked> PUBLISHED_IN</label>
    </div>
    <button id="reset" class="btn">Limpar filtros</button>
  </div>
  <aside id="panel" class="panel">
    <div class="panel-head"><div><small>GRAPH · CONTEXTO</small><strong id="panelTitle">Visão geral</strong></div><button id="close" class="btn">×</button></div>
    <div id="panelBody" class="body"></div>
  </aside>
  <div id="loading" class="loading">Carregando rede…</div>
  <div id="error" class="error" hidden><b>Falha ao carregar a base</b><small id="errorText"></small></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id), urls=['authors','articles','institutions','venues','authored','affiliated','published'];
const S={nodes:[],edges:[],map:new Map(),adj:new Map(),types:new Set(['Author','Article','Institution','Venue']),rels:new Set(['AUTHORED','AFFILIATED_WITH','PUBLISHED_IN']),q:'',cy:null,min:0,max:0};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls=t=>({Author:'a',Article:'p',Institution:'i',Venue:'v'}[t]||'');
async function get(name){let r=await fetch(`./data/${name}.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`${name}.json: HTTP ${r.status}`);return r.json()}
function setup([authors,articles,institutions,venues,authored,affiliated,published]){
  S.nodes=[...authors,...articles,...institutions,...venues];
  S.edges=[
    ...authored.map((e,i)=>({id:`a:${i}`,source:e[0],target:e[1],relationship:'AUTHORED'})),
    ...affiliated,...published
  ];
  S.map=new Map(S.nodes.map(n=>[n.id,n])); S.adj=new Map(S.nodes.map(n=>[n.id,new Set()]));
  S.edges.forEach(e=>{S.adj.get(e.source)?.add(e.target);S.adj.get(e.target)?.add(e.source)});
  S.nodes.filter(n=>n.node_type==='Author').forEach(n=>{n.degree=S.edges.filter(e=>e.source===n.id||e.target===n.id).length;n.publication_degree=S.edges.filter(e=>e.relationship==='AUTHORED'&&(e.source===n.id||e.target===n.id)).length});
  S.nodes.filter(n=>n.node_type==='Article').forEach(n=>n.author_count=S.edges.filter(e=>e.relationship==='AUTHORED'&&(e.source===n.id||e.target===n.id)).length);
  let ds=S.nodes.filter(n=>n.node_type==='Author').map(n=>n.degree),mn=Math.min(...ds),mx=Math.max(...ds);
  S.nodes.filter(n=>n.node_type==='Author').forEach(n=>n.size=28+Math.sqrt((n.degree-mn)/(mx-mn||1))*34);
  let ys=S.nodes.filter(n=>n.node_type==='Article'&&n.year).map(n=>n.year);S.min=Math.min(...ys);S.max=Math.max(...ys);
  ['fromYear','toYear'].forEach(id=>{$(id).min=S.min;$(id).max=S.max});$('fromYear').value=S.min;$('toYear').value=S.max;yearLabels()
}
function text(n){return[n.label,n.title,n.doi,n.venue,n.keywords_official,n.keywords_normalized,n.institution_hint].join(' ').toLowerCase()}
function graph(){
  let ids=new Set;
  S.nodes.forEach(n=>{if(!S.types.has(n.node_type))return;if(n.node_type==='Article'&&n.year&&(n.year<+$('fromYear').value||n.year>+$('toYear').value))return;ids.add(n.id)});
  if(S.q){let m=[...ids].filter(id=>text(S.map.get(id)).includes(S.q)),keep=new Set(m);m.forEach(id=>S.adj.get(id)?.forEach(x=>ids.has(x)&&keep.add(x)));ids=keep}
  let nodes=[...ids].map(id=>({data:S.map.get(id)})),edges=S.edges.filter(e=>S.rels.has(e.relationship)&&ids.has(e.source)&&ids.has(e.target)).map(e=>({data:e}));
  return{elements:[...nodes,...edges],nodes,edges}
}
function styles(){return[
{selector:'node',style:{label:'data(label)','font-size':9,color:'#404850','text-wrap':'wrap','text-max-width':135,'text-valign':'bottom','text-margin-y':8,'background-color':'#777','border-width':1,'border-color':'#9ba4ac',width:30,height:30}},
{selector:'node[node_type="Author"]',style:{shape:'ellipse',width:'data(size)',height:'data(size)','background-color':'#3f789f'}},
{selector:'node[node_type="Author"][group="coauthor"]',style:{'background-color':'#70899b'}},
{selector:'node[node_type="Article"]',style:{shape:'round-rectangle',width:38,height:32,'background-color':'#7d858d',label:''}},
{selector:'node[node_type="Institution"]',style:{shape:'hexagon',width:42,height:38,'background-color':'#57826e',label:''}},
{selector:'node[node_type="Venue"]',style:{shape:'rectangle',width:38,height:32,'background-color':'#786785',label:''}},
{selector:'edge',style:{width:1,opacity:.35,'curve-style':'bezier','line-color':'#b8c0c7'}},
{selector:'edge[relationship="AUTHORED"]',style:{width:1.5,opacity:.62,'line-color':'#7390a4'}},
{selector:'edge[relationship="AFFILIATED_WITH"]',style:{'line-color':'#72917f'}},
{selector:'edge[relationship="PUBLISHED_IN"]',style:{'line-color':'#8c8094'}},
{selector:':selected',style:{'border-width':3,'border-color':'#111820'}},{selector:'.dim',style:{opacity:.07}},{selector:'edge.dim',style:{opacity:.025}},{selector:'.hot',style:{opacity:1}},{selector:'edge.hot',style:{opacity:.9,width:2}}
]}
function layout(){let n=$('layout').value;return{name:n,animate:false,fit:true,padding:55,...(n==='cose'?{idealEdgeLength:105,nodeRepulsion:700000,numIter:900}:{})}}
function render(relayout=false){let d=graph();S.cy.elements().remove();S.cy.add(d.elements);$('status').textContent=`${d.nodes.length} nós · ${d.edges.length} relações`;if(relayout)S.cy.layout(layout()).run();overview()}
function row(n){return `<button class="row" data-id="${esc(n.id)}"><span class="dot ${cls(n.node_type)}"></span><span>${esc(n.label)}</span></button>`}
function overview(){let ns=S.cy.nodes().map(n=>n.data()),count=t=>ns.filter(n=>n.node_type===t).length;$('panelTitle').textContent='Visão geral';$('panelBody').innerHTML=`<div class="stats"><div class="stat"><small>nós</small><b>${ns.length}</b></div><div class="stat"><small>arestas</small><b>${S.cy.edges().length}</b></div><div class="stat"><small>autores</small><b>${count('Author')}</b></div><div class="stat"><small>artigos</small><b>${count('Article')}</b></div></div>${['Author','Article','Institution','Venue'].map(t=>{let a=ns.filter(n=>n.node_type===t);return a.length?`<div class="section"><h4>${t} · ${a.length}</h4>${a.slice(0,30).map(row).join('')}</div>`:''}).join('')}`;wire()}
function detail(n){$('panel').classList.add('open');$('panelTitle').textContent=n.label;let r=n.node_type==='Author'?[['Papel',n.role||n.group],['Artigos na rede',n.publication_degree],['Grau',n.degree],['Instituição',n.institution_hint],['ORCID',n.orcid],['Lattes',n.lattes_status]]:n.node_type==='Article'?[['Ano',n.year],['Autores',n.author_count],['DOI',n.doi],['Publicado em',n.venue],['Tipo',n.publication_type],['Escopo',n.scope],['Keywords',n.keywords_normalized]]:n.node_type==='Institution'?[['Cidade',n.city],['País',n.country]]:[['Publicação',n.name||n.label]];let neighbors=[...(S.adj.get(n.id)||[])].map(id=>S.map.get(id)).filter(Boolean);$('panelBody').innerHTML=`<span class="tag">${esc(n.node_type)}</span>${r.filter(x=>x[1]!==''&&x[1]!=null).map(x=>`<div class="detail"><label>${esc(x[0])}</label>${esc(x[1])}</div>`).join('')}${n.url?`<a class="link" href="${esc(n.url)}" target="_blank" rel="noopener">Abrir fonte ↗</a>`:''}<div class="section"><h4>Conexões diretas · ${neighbors.length}</h4>${neighbors.slice(0,40).map(row).join('')}</div>`;wire()}
function wire(){$('panelBody').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let x=S.cy.getElementById(b.dataset.id);if(x.length){S.cy.nodes().unselect();x.select();S.cy.animate({center:{eles:x},zoom:Math.max(1,S.cy.zoom())},{duration:220});detail(x.data())}})}
function yearLabels(){$('fromLabel').textContent=$('fromYear').value;$('toLabel').textContent=$('toYear').value}
function bootCy(){let d=graph();S.cy=cytoscape({container:$('cy'),elements:d.elements,style:styles(),layout:layout(),minZoom:.18,maxZoom:3.5,wheelSensitivity:.18,boxSelectionEnabled:true,selectionType:'additive'});$('status').textContent=`${d.nodes.length} nós · ${d.edges.length} relações`;overview();
S.cy.on('mouseover','node',e=>{let hot=e.target.closedNeighborhood();S.cy.elements().addClass('dim');hot.removeClass('dim').addClass('hot')});
S.cy.on('mouseout','node',()=>S.cy.elements().removeClass('dim hot'));
S.cy.on('tap','node',e=>detail(e.target.data()));
S.cy.on('tap',e=>{if(e.target===S.cy){S.cy.nodes().unselect();overview()}});
}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{let t=b.dataset.type;S.types.has(t)?S.types.delete(t):S.types.add(t);b.classList.toggle('off',!S.types.has(t));render(false)});
document.querySelectorAll('.rel').forEach(c=>c.onchange=()=>{c.checked?S.rels.add(c.dataset.rel):S.rels.delete(c.dataset.rel);render(false)});
$('q').oninput=e=>{S.q=e.target.value.trim().toLowerCase();render(false)};
$('filters').onclick=()=>{$('filterPop').hidden=!$('filterPop').hidden};$('info').onclick=()=>{$('panel').classList.toggle('open');if($('panel').classList.contains('open'))overview()};$('close').onclick=()=>$('panel').classList.remove('open');
$('fromYear').oninput=()=>{yearLabels();render(false)};$('toYear').oninput=()=>{yearLabels();render(false)};
$('reset').onclick=()=>{$('fromYear').value=S.min;$('toYear').value=S.max;S.rels=new Set(['AUTHORED','AFFILIATED_WITH','PUBLISHED_IN']);document.querySelectorAll('.rel').forEach(x=>x.checked=true);yearLabels();render(true)};
$('layout').onchange=()=>S.cy.layout(layout()).run();$('minus').onclick=()=>S.cy.zoom({level:Math.max(.18,S.cy.zoom()/1.18),renderedPosition:{x:S.cy.width()/2,y:S.cy.height()/2}});$('plus').onclick=()=>S.cy.zoom({level:Math.min(3.5,S.cy.zoom()*1.18),renderedPosition:{x:S.cy.width()/2,y:S.cy.height()/2}});$('fit').onclick=()=>S.cy.fit(S.cy.elements(),55);
Promise.all(urls.map(get)).then(d=>{setup(d);bootCy();$('loading').remove()}).catch(err=>{console.error(err);$('loading').hidden=true;$('error').hidden=false;$('errorText').textContent=err.message;$('status').textContent='Falha ao carregar a base'})
})();
</script>
</body>
</html>

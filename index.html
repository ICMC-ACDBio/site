<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACDBio · Rede bibliográfica</title><style>:root{--bg:#f7f8f9;--card:#fff;--tx:#182028;--mut:#74808a;--ln:#dfe4e8;--au:#3b7398;--ar:#7b838b;--in:#58836f;--ve:#786687}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:13px Inter,system-ui;color:var(--tx);background:var(--bg)}header{height:62px;display:flex;align-items:center;gap:12px;padding:9px 13px;border-bottom:1px solid var(--ln);background:#fff}.brand{min-width:220px}.brand b{display:block}.brand small{color:var(--mut)}.tools{display:flex;align-items:center;gap:6px;flex:1}.search{height:37px;flex:1;max-width:420px;border:1px solid var(--ln);border-radius:9px;padding:0 11px;background:#f1f3f5}.chip,.btn,select{height:35px;border:1px solid var(--ln);border-radius:9px;background:#fff;padding:0 9px;cursor:pointer}.chip.off{opacity:.35}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.Author{background:var(--au)}.Article{background:var(--ar);border-radius:2px}.Institution{background:var(--in)}.Venue{background:var(--ve);border-radius:2px}main{height:calc(100% - 62px);position:relative}#cy{position:absolute;inset:0;background-image:radial-gradient(#cdd3d8 .7px,transparent .7px);background-size:18px 18px}.float{position:absolute;left:13px;bottom:13px;z-index:5;display:flex;gap:6px}.panel{position:absolute;right:0;top:0;width:min(390px,92vw);height:100%;background:#fffc;backdrop-filter:blur(12px);border-left:1px solid var(--ln);transform:translateX(101%);transition:.2s;z-index:10;display:flex;flex-direction:column}.panel.open{transform:none}.ph{padding:13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ln)}.pb{overflow:auto;padding:13px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat,.pop,.loading{border:1px solid var(--ln);border-radius:9px;background:#fff}.stat{padding:9px}.stat strong{display:block;font:600 18px ui-monospace}.sec{margin:16px 0}.sec h3{font:10px ui-monospace;color:var(--mut);text-transform:uppercase}.row{width:100%;display:flex;gap:7px;align-items:center;padding:7px;border:0;border-radius:7px;background:transparent;text-align:left;cursor:pointer}.row:hover{background:#f0f2f4}.detail{padding:8px 0;border-bottom:1px solid var(--ln)}.detail b{display:block;font:9px ui-monospace;color:var(--mut);text-transform:uppercase;margin-bottom:4px}.tag{display:inline-block;padding:3px 7px;border:1px solid var(--ln);border-radius:999px;color:var(--mut);font-size:10px}.pop{position:absolute;right:10px;top:10px;width:285px;padding:12px;z-index:12}.pop[hidden]{display:none}.pop label{display:block;margin:9px 0}.pop input[type=range]{width:100%}.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:15px;z-index:20}.zoom button{width:36px;height:35px;border:1px solid var(--ln);background:#fff}.link{display:inline-block;margin-top:10px;color:#245b7b;text-decoration:none}@media(max-width:950px){.chips{display:none}}@media(max-width:650px){header{height:56px;padding:7px}.brand{min-width:auto}.brand small{display:none}.panel{top:auto;bottom:0;width:100%;height:68%;border-left:0;border-top:1px solid var(--ln);border-radius:15px 15px 0 0;transform:translateY(101%)}main{height:calc(100% - 56px)}}</style></head><body><header><div class="brand"><b>Rede bibliográfica</b><small id="status">Carregando…</small></div><div class="tools"><input id="q" class="search" placeholder="Buscar autor, artigo, DOI, keyword…"><div id="chips" class="chips"><button class="chip" data-t="Author"><span class="dot Author"></span>Autores</button><button class="chip" data-t="Article"><span class="dot Article"></span>Artigos</button><button class="chip" data-t="Institution"><span class="dot Institution"></span>Instituições</button><button class="chip" data-t="Venue"><span class="dot Venue"></span>Venues</button></div><button id="filterBtn" class="btn">Filtros</button><button id="infoBtn" class="btn">Info</button></div></header><main><div id="cy"></div><div class="float"><div class="zoom"><button id="minus">−</button><button id="fit">◎</button><button id="plus">+</button></div><select id="layout"><option value="cose">Orgânico</option><option value="concentric">Radial</option><option value="breadthfirst">Hierárquico</option><option value="circle">Circular</option><option value="grid">Grade</option></select></div><aside id="panel" class="panel"><div class="ph"><div><small>GRAPH · CONTEXTO</small><b id="ptitle">Visão geral</b></div><button id="close" class="btn">×</button></div><div id="pbody" class="pb"></div></aside><div id="pop" class="pop" hidden><b>Filtros</b><label>De <span id="l1"></span><input id="y1" type="range"></label><label>Até <span id="l2"></span><input id="y2" type="range"></label><label><input class="rel" data-r="AUTHORED" type="checkbox" checked> AUTHORED</label><label><input class="rel" data-r="AFFILIATED_WITH" type="checkbox" checked> AFFILIATED_WITH</label><label><input class="rel" data-r="PUBLISHED_IN" type="checkbox" checked> PUBLISHED_IN</label><button id="reset" class="btn">Limpar filtros</button></div><div id="loading" class="loading">Carregando planilha…</div></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script><script>(()=>{const g=id=>document.getElementById(id),S={n:[],e:[],m:new Map,a:new Map,t:new Set(['Author','Article','Institution','Venue']),r:new Set(['AUTHORED','AFFILIATED_WITH','PUBLISHED_IN']),q:'',cy:null,min:0,max:0},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rows(w,n){return w.Sheets[n]?XLSX.utils.sheet_to_json(w.Sheets[n],{defval:''}):[]}function lookup(a,k){return new Map(a.map(x=>[String(x[k]).trim(),x]))}function parse(w){let N=rows(w,'Nodes'),E=rows(w,'Edges'),A=lookup(rows(w,'Authors'),'author_id'),P=lookup(rows(w,'Articles'),'article_id'),I=lookup(rows(w,'Institutions'),'institution_id'),V=lookup(rows(w,'Venues'),'venue_id');S.n=N.map(x=>{let id=String(x.node_id).trim(),t=String(x.node_type).trim(),z=t==='Author'?A.get(id):t==='Article'?P.get(id):t==='Institution'?I.get(id):V.get(id),d={...x,...(z||{}),id,node_type:t,label:x.label||(z?.name||z?.title)||''};if(t==='Article'){d.year=Number(d.year)||null;d.url=d.doi_url||d.url}else if(t==='Author')d.url=d.lattes_url||d.orcid_url||d.profile_source||d.url;return d});S.e=E.map((x,i)=>({id:'e'+i,source:String(x.source).trim(),target:String(x.target).trim(),relationship:String(x.relationship).trim()})).filter(x=>x.relationship!=='HAS_KEYWORD');S.m=new Map(S.n.map(x=>[x.id,x]));S.a=new Map(S.n.map(x=>[x.id,new Set]));S.e.forEach(e=>{S.a.get(e.source)?.add(e.target);S.a.get(e.target)?.add(e.source)});S.n.filter(x=>x.node_type==='Author').forEach(x=>{x.degree=S.e.filter(e=>e.source===x.id||e.target===x.id).length;x.publication_degree=S.e.filter(e=>e.relationship==='AUTHORED'&&(e.source===x.id||e.target===x.id)).length});S.n.filter(x=>x.node_type==='Article').forEach(x=>x.author_count=S.e.filter(e=>e.relationship==='AUTHORED'&&(e.source===x.id||e.target===x.id)).length);let ds=S.n.filter(x=>x.node_type==='Author').map(x=>x.degree),mn=Math.min(...ds),mx=Math.max(...ds);S.n.filter(x=>x.node_type==='Author').forEach(x=>x.size=28+Math.sqrt((x.degree-mn)/(mx-mn||1))*34);let ys=S.n.filter(x=>x.node_type==='Article'&&x.year).map(x=>x.year);S.min=Math.min(...ys);S.max=Math.max(...ys);['y1','y2'].forEach(id=>{g(id).min=S.min;g(id).max=S.max});g('y1').value=S.min;g('y2').value=S.max;years()}function text(x){return[x.label,x.title,x.doi,x.venue,x.keywords_official,x.keywords_normalized,x.institution_hint].join(' ').toLowerCase()}function graph(){let a=new Set;S.n.forEach(x=>{if(x.node_type==='Keyword'||!S.t.has(x.node_type))return;if(x.node_type==='Article'&&x.year&&(x.year<+g('y1').value||x.year>+g('y2').value))return;a.add(x.id)});if(S.q){let q=S.q.toLowerCase(),m=[...a].filter(id=>text(S.m.get(id)).includes(q)),z=new Set(m);m.forEach(id=>S.a.get(id)?.forEach(v=>a.has(v)&&z.add(v)));a=z}let n=[...a].map(id=>({data:S.m.get(id)})),e=S.e.filter(x=>S.r.has(x.relationship)&&a.has(x.source)&&a.has(x.target)).map(x=>({data:x}));return{all:[...n,...e],nc:n.length,ec:e.length}}function style(){return[{selector:'node',style:{label:'data(label)','font-size':9,color:'#404850','text-wrap':'wrap','text-max-width':135,'text-valign':'bottom','text-margin-y':8,'background-color':'#777','border-width':1,'border-color':'#9ba4ac',width:30,height:30}},{selector:'node[node_type="Author"]',style:{shape:'ellipse',width:'data(size)',height:'data(size)','background-color':'#3b7398'}},{selector:'node[node_type="Author"][group="coauthor"]',style:{'background-color':'#718899'}},{selector:'node[node_type="Article"]',style:{shape:'round-rectangle',width:38,height:32,'background-color':'#7b838b',label:''}},{selector:'node[node_type="Institution"]',style:{shape:'hexagon',width:40,height:36,'background-color':'#58836f',label:''}},{selector:'node[node_type="Venue"]',style:{shape:'rectangle',width:38,height:32,'background-color':'#786687',label:''}},{selector:'edge',style:{width:1,opacity:.32,'curve-style':'bezier','line-color':'#aab2b9'}},{selector:'edge[relationship="AUTHORED"]',style:{width:1.5,opacity:.6,'line-color':'#718da1'}},{selector:'edge[relationship="AFFILIATED_WITH"]',style:{'line-color':'#678b79'}},{selector:'edge[relationship="PUBLISHED_IN"]',style:{'line-color':'#887c90'}},{selector:':selected',style:{'border-width':3,'border-color':'#111'}},{selector:'.dim',style:{opacity:.08}},{selector:'edge.dim',style:{opacity:.03}},{selector:'.hot',style:{opacity:1}},{selector:'edge.hot',style:{opacity:.9,width:2}}]}function lay(){let n=g('layout').value;return{name:n,animate:false,fit:true,padding:55,...(n==='cose'?{idealEdgeLength:100,nodeRepulsion:700000,numIter:800}:{})}}function render(rel=false){let d=graph();S.cy.json({elements:d.all});g('status').textContent=`${d.nc} nós · ${d.ec} relações`;if(rel)S.cy.layout(lay()).run();overview()}function overview(){let ns=S.cy.nodes().map(x=>x.data()),types=t=>ns.filter(x=>x.node_type===t);g('ptitle').textContent='Visão geral';g('pbody').innerHTML=`<div class="statgrid"><div class="stat"><small>nós</small><strong>${ns.length}</strong></div><div class="stat"><small>arestas</small><strong>${S.cy.edges().length}</strong></div><div class="stat"><small>autores</small><strong>${types('Author').length}</strong></div><div class="stat"><small>artigos</small><strong>${types('Article').length}</strong></div></div>${['Author','Article','Institution','Venue'].map(t=>list(t,types(t))).join('')}`;wire()}function list(t,a){return a.length?`<div class="sec"><h3>${t} · ${a.length}</h3>${a.slice(0,28).map(x=>`<button class="row" data-id="${esc(x.id)}"><span class="dot ${t}"></span>${esc(x.label)}</button>`).join('')}</div>`:''}function detail(x){g('panel').classList.add('open');g('ptitle').textContent=x.label;let r=x.node_type==='Author'?[['Papel',x.role||x.group],['Artigos na rede',x.publication_degree],['Grau',x.degree],['Instituição',x.institution_hint],['ORCID',x.orcid]]:x.node_type==='Article'?[['Ano',x.year],['Autores',x.author_count],['DOI',x.doi],['Publicado em',x.venue],['Tipo',x.publication_type],['Keywords',x.keywords_normalized]]:x.node_type==='Institution'?[['Cidade',x.city],['País',x.country]]:[['Publicação',x.name]];g('pbody').innerHTML=`<span class="tag">${esc(x.node_type)}</span>${r.filter(z=>z[1]!==''&&z[1]!=null).map(z=>`<div class="detail"><b>${esc(z[0])}</b>${esc(z[1])}</div>`).join('')}${x.url?`<a class="link" target="_blank" rel="noopener" href="${esc(x.url)}">Abrir fonte ↗</a>`:''}<div class="sec"><h3>Conexões diretas</h3>${[...(S.a.get(x.id)||[])].map(id=>S.m.get(id)).filter(Boolean).slice(0,35).map(y=>`<button class="row" data-id="${esc(y.id)}"><span class="dot ${y.node_type}"></span>${esc(y.label)}</button>`).join('')}</div>`;wire()}function wire(){g('pbody').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let n=S.cy.getElementById(b.dataset.id);if(n.length){S.cy.nodes().unselect();n.select();S.cy.animate({center:{eles:n},zoom:Math.max(1,S.cy.zoom())},{duration:250});detail(n.data())}})}function years(){g('l1').textContent=g('y1').value;g('l2').textContent=g('y2').value}function boot(){let d=graph();S.cy=cytoscape({container:g('cy'),elements:d.all,style:style(),layout:lay(),minZoom:.2,maxZoom:3.5,wheelSensitivity:.18,boxSelectionEnabled:true,selectionType:'additive'});g('status').textContent=`${d.nc} nós · ${d.ec} relações`;g('loading').remove();overview();S.cy.on('mouseover','node',e=>{let h=e.target.closedNeighborhood();S.cy.elements().addClass('dim').removeClass('hot');h.removeClass('dim').addClass('hot')});S.cy.on('mouseout','node',()=>S.cy.elements().removeClass('dim hot'));S.cy.on('tap','node',e=>detail(e.target.data()))}fetch('./data/graph_bibliography_base.xlsx?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.arrayBuffer()}).then(b=>{parse(XLSX.read(b,{type:'array'}));boot()}).catch(e=>g('loading').innerHTML='<b>Falha ao carregar a base</b><br><small>'+esc(e.message)+'</small>');g('q').oninput=e=>{S.q=e.target.value;render()};g('chips').onclick=e=>{let b=e.target.closest('[data-t]');if(!b)return;S.t.has(b.dataset.t)?S.t.delete(b.dataset.t):S.t.add(b.dataset.t);b.classList.toggle('off',!S.t.has(b.dataset.t));render()};g('filterBtn').onclick=()=>g('pop').hidden=!g('pop').hidden;document.querySelectorAll('.rel').forEach(c=>c.onchange=()=>{c.checked?S.r.add(c.dataset.r):S.r.delete(c.dataset.r);render()});['y1','y2'].forEach(id=>g(id).oninput=()=>{if(+g('y1').value>+g('y2').value){if(id==='y1')g('y2').value=g('y1').value;else g('y1').value=g('y2').value}years();render()});g('reset').onclick=()=>{S.q='';g('q').value='';S.t=new Set(['Author','Article','Institution','Venue']);S.r=new Set(['AUTHORED','AFFILIATED_WITH','PUBLISHED_IN']);document.querySelectorAll('.chip').forEach(x=>x.classList.remove('off'));document.querySelectorAll('.rel').forEach(x=>x.checked=true);g('y1').value=S.min;g('y2').value=S.max;years();render(true)};g('layout').onchange=()=>S.cy?.layout(lay()).run();g('infoBtn').onclick=()=>{g('panel').classList.toggle('open');if(g('panel').classList.contains('open'))overview()};g('close').onclick=()=>g('panel').classList.remove('open');g('plus').onclick=()=>S.cy?.zoom(Math.min(3.5,S.cy.zoom()*1.18));g('minus').onclick=()=>S.cy?.zoom(Math.max(.2,S.cy.zoom()/1.18));g('fit').onclick=()=>S.cy?.fit(S.cy.elements(),55)})();</script></body></html>
